name: Suggest a meeting or correction
description: Share an event link and any useful notes.
body:
  - type: input
    id: event-link
    attributes:
      label: Event link
      description: The organizer's event page, or another useful starting point.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional details about the meeting or what needs updating.
    validations:
      required: false
